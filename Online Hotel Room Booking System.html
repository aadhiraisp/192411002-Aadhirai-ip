<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>LuxuryStay Hotel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#eef5ff;color:#222}
.hero{height:60vh;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1400&q=80') center/cover;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
.hero h1{font-size:52px}.hero p{margin:10px 0 20px}.btn{padding:12px 25px;background:#ffb703;border:none;border-radius:30px;cursor:pointer}
.wrap{max-width:1200px;margin:auto;padding:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.12);transition:.3s}.card:hover{transform:translateY(-8px)}
.card img{width:100%;height:180px;object-fit:cover}.card div{padding:16px}
form{background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 18px rgba(0,0,0,.12);margin-top:30px}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{padding:12px;border:none;border-radius:8px;background:#0d6efd;color:#fff;width:100%;cursor:pointer}
table{width:100%;margin-top:25px;border-collapse:collapse;background:#fff}th,td{padding:10px;border:1px solid #ddd}th{background:#0d6efd;color:#fff}
footer{text-align:center;background:#0d6efd;color:#fff;padding:20px;margin-top:30px}
</style></head><body>
<section class='hero'><div><h1>LuxuryStay Hotel</h1><p>Book your perfect vacation in seconds.</p><a href='#book'><button class='btn'>Reserve Now</button></a></div></section>
<div class='wrap'>
<h2>Popular Rooms</h2>
<div class='grid' id='rooms'></div>
<form id='book'>
<h2>Reservation Form</h2>
<input id='n' placeholder='Guest Name'><input id='h' placeholder='Hotel Name' value='LuxuryStay Resort'>
<select id='r'><option>Single</option><option>Double</option><option>Deluxe</option><option>Suite</option></select>
<input id='ci' type='date'><input id='co' type='date'>
<select id='p'><option>Credit Card</option><option>UPI</option><option>Net Banking</option></select>
<button type='button' onclick='reserve()'>Confirm Booking</button>
<h3 id='status'></h3>
</form>
<h2 style='margin-top:30px'>My Reservations</h2>
<table><tr><th>Name</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Payment</th><th></th></tr><tbody id='list'></tbody></table>
</div><footer>© 2026 LuxuryStay Hotel Booking</footer>
<script>
const data=[
['Single','₹2,000','https://picsum.photos/500/300?hotel1'],
['Double','₹3,500','https://picsum.photos/500/300?hotel2'],
['Deluxe','₹5,000','https://picsum.photos/500/300?hotel3'],
['Suite','₹8,500','https://picsum.photos/500/300?hotel4']];
rooms.innerHTML=data.map(x=>`<div class='card'><img src='${x[2]}'><div><h3>${x[0]}</h3><p>${x[1]} / night</p><button onclick="r.value='${x[0]}';location='#book'">Book</button></div></div>`).join('');
let b=JSON.parse(localStorage.hotel||'[]');
function draw(){list.innerHTML=b.map((e,i)=>`<tr><td>${e.n}</td><td>${e.r}</td><td>${e.ci}</td><td>${e.co}</td><td>${e.p}</td><td><button onclick='del(${i})'>Cancel</button></td></tr>`).join('');localStorage.hotel=JSON.stringify(b);}
function reserve(){if(!n.value||!ci.value||!co.value)return alert('Fill all fields');b.push({n:n.value,r:r.value,ci:ci.value,co:co.value,p:p.value});status.innerHTML='✅ Reservation Confirmed!';draw();n.value='';ci.value='';co.value='';}
function del(i){b.splice(i,1);draw();}
draw();
</script></body></html>
